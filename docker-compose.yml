services:
  flexy:
    # Freqtrade mit FreqAI, Version fest gepinnt. Aktualisierungen nur bewusst und nach Tests.
    image: freqtradeorg/freqtrade:2026.9_freqai
    container_name: flexy
    restart: unless-stopped
    volumes:
      - ./user_data:/freqtrade/user_data
    # Schlüssel und Telegram-Daten kommen aus .env (nie ins Repo)
    env_file: .env
    command: >
      trade
      --logfile /freqtrade/user_data/logs/flexy.log
      --db-url sqlite:////freqtrade/user_data/flexy.dryrun.sqlite
      --config /freqtrade/user_data/config.json
